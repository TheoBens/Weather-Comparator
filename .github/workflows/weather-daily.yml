name: Collecte et scores météo

on:
  schedule:
    # 06:15 UTC ~ 08h15 heure de Paris (UTC+1 hiver) ; ajuster si besoin
    - cron: "15 6 * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  collect-and-score:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather-benchmark/scripts
    # Connexion : soit DATABASE_URL, soit POSTGRES_* (comme en local — ex. pooler IPv4).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_SSLMODE: ${{ secrets.POSTGRES_SSLMODE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: weather-benchmark/scripts/requirements.txt

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Observations passées
        run: python collect_observations.py --days 21

      - name: Prévisions du jour
        run: python collect_forecasts.py --providers open_meteo

      - name: Calcul des scores
        run: python compute_scores.py --days 60
